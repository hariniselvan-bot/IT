<style>
/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#000;
  color:#0c0f1c;
  overflow-x:hidden;
}

/* ================= HEADER ================= */
.header-wrapper{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  display:flex;
  justify-content:center;
}

.header{
  width:calc(100% - 60px);
  max-width:1400px;
  height:96px;
  padding:0 34px;
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,.14),
    rgba(255,255,255,.06)
  );
  backdrop-filter:blur(20px);
  border-radius:22px;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 30px 60px rgba(0,0,0,.6);
}

/* LOGO */
.logo img{
  height:52px;
}


/* DESKTOP NAV */
.nav{
  display:flex;
  align-items:center;
  gap:28px;
  font-weight:600;
}

.nav a{
  color:#000000;
  text-decoration:none;
}
.nav a:hover,
.active{
  color:#22d3ee;
}

/* DROPDOWN */
.dropdown{
  position:relative;
}
.dropdown-menu{
  display:none;
  position:absolute;
  top:140%;
  left:0;
  background:#ffffff;
  border-radius:14px;
  min-width:160px;
  box-shadow:0 20px 40px rgba(0,0,0,.7);
}
.dropdown:hover .dropdown-menu{
  display:block;
}
.dropdown-menu a{
  display:block;
  padding:12px 16px;
  font-size:14px;
}

/* LOGIN */
.login-btn{
  background:#2279e4;
  color:#000000;
  padding:10px 22px;
  border-radius:12px;
  font-weight:800;
}

/* HAMBURGER */
.hamburger{
  display:none;
  width:46px;
  height:46px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  background:rgba(255,255,255,.2);
}
.hamburger i{
  font-size:22px;
  color:#000000;
}

/* ================= MOBILE MENU ================= */
.mobile-menu{
  position:fixed;
  top:110px;
  left:20px;
  right:20px;
  background:rgba(255, 255, 255, 0.92);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:24px;
  display:none;
  z-index:999;
}
.mobile-menu.open{
  display:block;
}

.mobile-menu a,
.mobile-drop-btn{
  display:block;
  width:100%;
  padding:12px 0;
  color:#000000;
  background:none;
  border:none;
  text-align:left;
  font-weight:600;
  cursor:pointer;
}

/* MOBILE DROPDOWN */
.mobile-drop{
  display:none;
  padding-left:14px;
}
.mobile-drop.open{
  display:block;
}

/* ================= HERO ================= */
.hero{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  padding:140px 6% 0;
  overflow:hidden;
}

/* BG IMAGE (DESKTOP) */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(0,0,0,0.12),rgba(0,0,0,0.12)),
    url("bg.webp");
  background-size:cover;
  background-position:center;
  filter:brightness(1.1) contrast(1.1) saturate(1.05);
  z-index:0;
}

/* CURVE MASK (DESKTOP) */
.hero::after{
  content:"";
  position:absolute;
  top:0;
  right:-12%;
  width:55%;
  height:100%;
  background:inherit;
  clip-path:ellipse(85% 100% at 100% 50%);
  z-index:1;
}

/* DOTS */
.dots{
  position:absolute;
  inset:0;
  background-image:radial-gradient(
    rgba(255,255,255,0.18) 1px,
    transparent 1px
  );
  background-size:22px 22px;
  opacity:.14;
  z-index:2;
}

/* HERO CONTENT */
.hero-left{
  max-width:650px;
  position:relative;
  z-index:3;
}

.hero-left small{
  letter-spacing:2px;
  opacity:.9;
}

.hero-title{
  font-size:52px;
  margin:20px 0;
  line-height:1.2;
}

.animate-text{
  color:#ff5c2d;
  display:inline-block;
  animation:scaleFade 2.5s infinite;
}

.hero-btn{
  background:#ff5c2d;
  color:#000;
  padding:14px 30px;
  border-radius:30px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

/* TEXT ANIMATION */
@keyframes scaleFade{
  0%{transform:scale(.6);opacity:0}
  40%{transform:scale(1);opacity:1}
  100%{opacity:0}
}

/* ================= RESPONSIVE ================= */
@media(max-width:1117px){
  .nav{display:none}
  .hamburger{
    display:flex;
    align-items:center;
    justify-content:center;
  }
}

@media(max-width:900px){
  .hero{
    padding:120px 8% 0;
    text-align:center;
  }

  /* MOBILE BG */
  .hero::before{
    background-image:
      linear-gradient(rgba(0,0,0,0.18),rgba(0,0,0,0.18)),
      url("bg.webp");
    background-size:cover;
    background-position:top center;
  }

  .hero::after{
    display:none;
  }

  .hero-left{
    margin:auto;
  }

  .hero-title{
    font-size:36px;
  }
}
</style>

<body>

<div class="signup-box">
    <h1 class="text-3xl font-semibold mb-8 tracking-wide">CREATE ACCOUNT</h1>

    <!-- USERNAME -->
    <div class="input-group">
        <input id="name" type="text" placeholder="FULL NAME">
        <span class="icon"><i class="fas fa-user"></i></span>
        <p id="nameErr" class="error-text"></p>
    </div>

    <!-- EMAIL -->
    <div class="input-group">
        <input id="email" type="email" placeholder="EMAIL">
        <span class="icon"><i class="fas fa-envelope"></i></span>
        <p id="emailErr" class="error-text"></p>
    </div>

    <!-- PASSWORD -->
    <div class="input-group">
        <input id="password" type="password" placeholder="PASSWORD">
        <span class="icon"><i class="fas fa-lock"></i></span>
        <p id="passErr" class="error-text"></p>
    </div>

    <button class="signup-btn" onclick="submitSignup()">SIGN UP</button>

    <div class="extras">
        <a href="login.html">Already have an account? Login</a>
    </div>
</div>


<script>
function submitSignup() {
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let pass = document.getElementById("password").value.trim();

    let nameErr  = document.getElementById("nameErr");
    let emailErr = document.getElementById("emailErr");
    let passErr  = document.getElementById("passErr");

    // Clear previous errors
    nameErr.innerHTML = "";
    emailErr.innerHTML = "";
    passErr.innerHTML = "";

    let error = false;

    if (name === "") {
        nameErr.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Please enter your name`;
        error = true;
    }

    if (email === "") {
        emailErr.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Please enter your email`;
        error = true;
    } else {
        const emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
        if (!emailPattern.test(email)) {
            emailErr.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Enter a valid Gmail`;
            error = true;
        }
    }

    if (pass === "") {
        passErr.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Please enter a password`;
        error = true;
    }

    // ❌ Stop if error
    if (error) return;

    // ✅ Success → redirect
    window.location.href = "404.html";
}
</script>

  <script>
    const btn = document.getElementById("hamburgerBtn");
    const menu = document.getElementById("mobileMenu");

    btn.addEventListener("click", () => {
      menu.classList.toggle("hidden");
      document.body.style.overflow = menu.classList.contains("hidden") ? "auto" : "hidden";
    });

    const elements = document.querySelectorAll("[data-animate]");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) entry.target.classList.add("visible");
      });
    }, { threshold: 0.2 });

    elements.forEach((el) => observer.observe(el));
  </script>

<script>
/* ================= DESKTOP DROPDOWN ================= */
const desktopHomeBtn   = document.getElementById("desktopHomeBtn");
const desktopHomePanel = document.getElementById("desktopHomePanel");
const desktopWrap      = document.getElementById("desktopHomeWrap");

desktopHomeBtn.addEventListener("click", () => {
  const open = desktopHomePanel.classList.contains("hidden");
  desktopHomePanel.classList.toggle("hidden", !open);
  desktopHomeBtn.setAttribute("aria-expanded", open);
});

/* Close dropdown when clicking outside */
document.addEventListener("click", function (e) {
  if (!desktopWrap.contains(e.target)) {
    desktopHomePanel.classList.add("hidden");
    desktopHomeBtn.setAttribute("aria-expanded", "false");
  }
});

/* ================= MOBILE DROPDOWN ================= */
function toggleMobileDrop() {
  document.getElementById("mobileHomeDrop").classList.toggle("hidden");
}
</script>
